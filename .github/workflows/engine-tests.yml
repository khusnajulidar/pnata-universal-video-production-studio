name: Engine tests

on:
  push:
    branches:
      - main
      - feat/production-engine-v0.1.0
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install engine and test dependencies
        working-directory: engine
        run: python -m pip install -e ".[validation]"
      - name: Run engine tests
        working-directory: engine
        run: pytest -q
      - name: Validate v0.3 starter project
        working-directory: engine
        run: pnata-validate-v3 examples/v03-validation/project.json
      - name: Render v0.2 smoke fixture
        working-directory: engine
        run: |
          pnata-render-v2 examples/v02-motion/project.json -o dist/v02-smoke.mp4 --qc dist/v02-qc.json
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json dist/v02-smoke.mp4
